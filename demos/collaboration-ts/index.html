<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AiEditor 源码协作示例</title>
  <style>
    body { font: 15px system-ui, sans-serif; color: #17212f; margin: 24px auto; padding: 0 24px; max-width: 1480px; background: #f8fafc; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    input, button { font: inherit; padding: 8px 10px; }
    input { width: 37ch; max-width: 80vw; font-family: ui-monospace, monospace; }
    button { cursor: pointer; }
    #health, #join-status { color: #64748b; font-size: 13px; }
    #join-status:empty { display: none; }
    #clients { display: grid; grid-template-columns: repeat(2, minmax(320px, 1fr)); gap: 16px; margin-top: 20px; }
    iframe { width: 100%; height: 435px; border: 1px solid #cbd5e1; border-radius: 8px; background: white; }
    @media(max-width: 850px) { #clients { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>AiEditor 源码协作示例</h1>
  <p>两个编辑者的颜色由协作服务分配。可以再加一名编辑者验证满员提示，或加入只读查看者观察同步。</p>
  <header>
    <label>文档 ID <input id="document-id" value="22222222-2222-4222-8222-222222222223" /></label>
    <label>文档名称 <input id="document-name" value="源码协作示例文档" /></label>
    <button id="writer">加入编辑者</button>
    <button id="reader">加入查看者</button>
    <button id="clear">关闭本页参与者</button>
  </header>
  <p id="health">正在检查服务…</p>
  <p id="join-status" role="status"></p>
  <div id="clients"></div>
  <script type="module" src="/main.ts"></script>
</body>
</html>
