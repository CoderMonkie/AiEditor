<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AiEditor 源码协作示例</title>
  <style>
    body { font: 15px system-ui, sans-serif; color: #17212f; margin: 24px; background: #f8fafc; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    input, button { font: inherit; padding: 8px 10px; }
    button { cursor: pointer; }
    #clients { display: grid; grid-template-columns: repeat(2, minmax(320px, 1fr)); gap: 16px; margin-top: 20px; }
    iframe { width: 100%; height: 430px; border: 1px solid #cbd5e1; border-radius: 8px; background: white; }
    @media(max-width: 850px) { #clients { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>AiEditor 源码协作示例</h1>
  <p>直接连接同级 kam-collaboration 开发服务；本页不经过旧 AiEditor/server。</p>
  <header>
    <label>房间 <input id="room" value="demo-source-1" /></label>
    <button id="writer">加入编辑者</button>
    <button id="reader">加入查看者</button>
    <button id="clear">关闭本页参与者</button>
  </header>
  <p id="health">正在检查服务…</p>
  <div id="clients"></div>
  <script type="module" src="/main.ts"></script>
</body>
</html>
