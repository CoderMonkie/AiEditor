<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AiEditor 协作参与者</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 0; color: #17212f; background: white; }
    header { min-height: 40px; padding: 7px 14px; background: #e8efff; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .reader header { background: #e8f5ef; }
    .identity, .members, .presence, .sync-state, .avatar-group { display: flex; align-items: center; }
    .identity { gap: 9px; min-width: 0; }
    .identity-text { display: grid; gap: 1px; min-width: 0; }
    .identity-name { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .identity-role { color: #52627a; font-size: 11px; }
    button { font: inherit; cursor: pointer; padding: 5px 9px; }
    .avatar { flex: 0 0 auto; width: 29px; height: 29px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--avatar-color, #94a3b8); color: #fff; font-size: 12px; font-weight: 700; text-shadow: 0 1px 2px #0005; border: 2px solid #fff; box-sizing: border-box; }
    .avatar-self { width: 33px; height: 33px; }
    .offline .avatar-self { background: #94a3b8; }
    .presence { position: relative; min-height: 34px; padding: 6px 14px; gap: 10px; justify-content: space-between; border-bottom: 1px solid #e8edf3; }
    .sync-state { gap: 7px; color: #475569; min-width: 0; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; flex: 0 0 auto; }
    .status-dot.ready { background: #22a06b; }
    .status-dot.offline { background: #e57557; }
    #status { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .members { gap: 7px; flex: 0 0 auto; }
    .avatar-group { padding-left: 3px; }
    .avatar-group .avatar + .avatar { margin-left: -7px; }
    .avatar-overflow { background: #e2e8f0; color: #334155; text-shadow: none; }
    #presence-toggle { border: 0; background: none; color: #315e98; padding: 3px 0; white-space: nowrap; }
    #presence-toggle:disabled { color: #94a3b8; cursor: default; }
    .presence-panel { position: absolute; top: calc(100% - 2px); right: 12px; z-index: 20; width: min(280px, calc(100vw - 40px)); max-height: 220px; overflow: auto; background: white; border: 1px solid #d7e0ea; border-radius: 9px; box-shadow: 0 8px 24px #17212f22; padding: 7px; }
    .presence-panel[hidden] { display: none; }
    .presence-row { display: flex; align-items: center; gap: 9px; padding: 6px 7px; border-radius: 6px; }
    .presence-row + .presence-row { border-top: 1px solid #f1f5f9; }
    .presence-row-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .presence-row-note { color: #64748b; font-size: 12px; }
    #editor { height: 326px; }
    #editor aie-footer, .reader #editor aie-header { display: none; }
  </style>
</head>
<body>
  <header>
    <div class="identity"><span id="self-avatar" class="avatar avatar-self" aria-hidden="true">?</span><span class="identity-text"><span id="title" class="identity-name">正在加入…</span><span id="role" class="identity-role"></span></span></div>
    <button id="connection" type="button">断开本端</button>
  </header>
  <div class="presence">
    <div class="sync-state"><span id="status-dot" class="status-dot" aria-hidden="true"></span><span id="status" role="status">等待首次服务同步…</span></div>
    <div class="members"><div id="avatar-group" class="avatar-group" aria-label="其他在线协作者"></div><button id="presence-toggle" type="button" aria-expanded="false" aria-controls="presence-panel" title="同一文档在所有页面中的在线演示窗口" disabled>-- 个窗口在线</button></div>
    <div id="presence-panel" class="presence-panel" hidden></div>
  </div>
  <div id="editor"></div>
  <script type="module" src="/client.ts"></script>
</body>
</html>
